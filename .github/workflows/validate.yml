name: Validate MangaFlow AI
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, phase-2-hybrid-ai]
  pull_request:
    branches: [main]
jobs:
  syntax-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check modular JavaScript
        run: |
          node --check js/storage.js
          node --check sw.js
          node --check js/core/project-data.js
          node --check js/core/project-bundle.js
          node --check playwright.config.js
          node --check js/ai/provider-manager.js
          node --check js/story/story-intelligence.js
          node --check js/story/story-bible.js
          node --check js/scenes/scene-intelligence.js
          node --check js/comic/comic-studio.js
          node --check js/audio/audio-studio.js
          node --check js/audio/audio-ui.js
          node --check js/video/video-studio.js
          node --check js/video/video-ui.js
          npm install --no-audit --no-fund
          npm test
          npx playwright install --with-deps chromium chrome msedge
          npm run test:browser
      - name: Check inline application JavaScript
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const blocks=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(!blocks.length) throw new Error('No inline application script found'); blocks.forEach((s,i)=>fs.writeFileSync('/tmp/mangaflow-inline-'+i+'.js',s));"
          for file in /tmp/mangaflow-inline-*.js; do node --check "$file"; done
